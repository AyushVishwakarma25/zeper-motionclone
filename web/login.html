<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · MotionClone Studio</title>
  <link rel="stylesheet" href="/web/style.css">
  <link rel="stylesheet" href="/web/dashboard.css">
  <style>
    body.login-body {
      background: #09090b;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #121218;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .login-brand {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .login-brand span {
      color: #00f2fe;
    }
    .login-subtitle {
      font-size: 13.5px;
      color: #a1a1aa;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #18181b;
      border: 1px solid #e4e4e7;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .btn-google:hover {
      background: #f4f4f5;
    }
    .btn-google:active {
      transform: scale(0.99);
    }
    .btn-google svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .login-error {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-top: 18px;
      text-align: left;
      line-height: 1.4;
    }
    .dev-token-toggle {
      margin-top: 24px;
      font-size: 11.5px;
      color: #71717a;
      cursor: pointer;
      text-decoration: underline;
    }
    .dev-token-section {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      text-align: left;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      background: #181822;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
    }
    .btn-token-submit {
      width: 100%;
      background: #27272a;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-token-submit:hover {
      background: #3f3f46;
    }
    .login-footer {
      font-size: 11px;
      color: #71717a;
      margin-top: 28px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">Motion<span>Clone</span></div>
    <div class="login-subtitle">Sign in to your production workspace</div>

    <form id="email-auth-form" onsubmit="return false;" style="margin-bottom: 20px;">
      <input type="email" id="email-input" class="form-input" placeholder="Work email (e.g. name@company.com)" required style="margin-bottom: 10px;">
      <input type="password" id="password-input" class="form-input" placeholder="Password" required style="margin-bottom: 12px;">
      <div style="display: flex; gap: 8px;">
        <button type="submit" class="btn-token-submit" id="btn-email-login" style="flex: 1; padding: 10px; background: #00f2fe; color: #000; font-weight: 700;">Sign In</button>
        <button type="button" class="btn-token-submit" id="btn-email-signup" style="flex: 1; padding: 10px; background: #27272a; color: #fff;">Create Account</button>
      </div>
    </form>

    <div style="display: flex; align-items: center; margin: 18px 0; color: #71717a; font-size: 11px;">
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
      <span style="padding: 0 10px;">OR</span>
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
    </div>

    <button type="button" class="btn-google" id="btn-google-login">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="login-error" id="login-error"></div>

    <div class="dev-token-toggle" id="toggle-token-input">Developer / Manual Token Sign In</div>

    <div class="dev-token-section" id="dev-token-box">
      <input type="password" id="manual-token-input" class="form-input" placeholder="Bearer ID token...">
      <button type="button" class="btn-token-submit" id="btn-manual-token">Sign In with Token</button>
    </div>

    <div class="login-footer">
      Protected with Firebase Authentication & Google Cloud
    </div>
  </div>

  <script>
    let authConfig = null;
    let authInitialized = false;

    async function initAuth() {
      try {
        const res = await fetch('/api/auth/config');
        authConfig = await res.json();
        if (window.firebase && authConfig && authConfig.projectId) {
          const config = {
            apiKey: authConfig.apiKey || 'AIzaSyFakeKeyForLocalDev123',
            authDomain: authConfig.authDomain || (authConfig.projectId + '.firebaseapp.com'),
            projectId: authConfig.projectId,
            appId: authConfig.appId || '1:123456789:web:abcdef'
          };
          if (!firebase.apps.length) {
            firebase.initializeApp(config);
          }
          authInitialized = true;

          // Check if already signed in
          firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
              const token = await user.getIdToken();
              verifyAndRedirect(token);
            }
          });
        }
      } catch (e) {
        console.warn('Auth config fetch error:', e);
      }
    }

    async function verifyAndRedirect(token) {
      try {
        localStorage.setItem('firebase_id_token', token);
        sessionStorage.setItem('firebase_id_token', token);
        // Test API token verification via /api/me
        const res = await fetch('/api/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 200) {
          window.location.href = '/dashboard';
        } else if (res.status === 403) {
          const data = await res.json();
          showError(data.detail || 'Access denied: your email is not in the allowed users list.');
          if (authInitialized) firebase.auth().signOut();
        } else {
          const data = await res.json();
          showError(data.detail || 'Authentication failed. Please try again.');
        }
      } catch (e) {
        showError('Network error connecting to authentication server.');
      }
    }

    function showError(msg) {
      const err = document.getElementById('login-error');
      err.textContent = msg;
      err.style.display = 'block';
    }

    document.getElementById('btn-email-login').addEventListener('click', async () => {
      document.getElementById('login-error').style.display = 'none';
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }
      if (!authInitialized) await initAuth();
      if (!authInitialized || !window.firebase) {
        showError('Firebase Auth is initializing or not configured for this origin. Use Developer Token sign-in below.');
        document.getElementById('dev-token-box').style.display = 'block';
        return;
      }
      try {
        const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
        if (cred && cred.user) {
          const token = await cred.user.getIdToken();
          await verifyAndRedirect(token);
        }
      } catch (error) {
        console.error('Email Sign-In Error:', error);
        showError(error.message || 'Email authentication failed.');
      }
    });

    document.getElementById('btn-email-signup').addEventListener('click', async () => {
      document.getElementById('login-error').style.display = 'none';
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) {
        showError('Please enter both email and password to create an account.');
        return;
      }
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }
      if (!authInitialized) await initAuth();
      if (!authInitialized || !window.firebase) {
        showError('Firebase Auth is initializing or not configured for this origin. Use Developer Token sign-in below.');
        document.getElementById('dev-token-box').style.display = 'block';
        return;
      }
      try {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        if (cred && cred.user) {
          const token = await cred.user.getIdToken();
          await verifyAndRedirect(token);
        }
      } catch (error) {
        console.error('Email Sign-Up Error:', error);
        showError(error.message || 'Account creation failed.');
      }
    });

    document.getElementById('btn-google-login').addEventListener('click', async () => {
      document.getElementById('login-error').style.display = 'none';
      if (!authInitialized) {
        await initAuth();
      }
      if (!authInitialized || !window.firebase) {
        showError('Firebase Auth is initializing or not configured for this origin. Use Developer Token sign-in below.');
        document.getElementById('dev-token-box').style.display = 'block';
        return;
      }
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        if (result && result.user) {
          const token = await result.user.getIdToken();
          await verifyAndRedirect(token);
        }
      } catch (error) {
        console.error('Google Sign-In Error:', error);
        showError(error.message || 'Google Sign-In failed.');
      }
    });

    // Developer / manual token support
    document.getElementById('toggle-token-input').addEventListener('click', () => {
      const box = document.getElementById('dev-token-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    });

    document.getElementById('btn-manual-token').addEventListener('click', () => {
      const token = document.getElementById('manual-token-input').value.trim();
      if (!token) return;
      verifyAndRedirect(token);
    });

    initAuth();
  </script>
</body>
</html>
