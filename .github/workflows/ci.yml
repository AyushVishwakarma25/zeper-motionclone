name: MotionClone CI

on:
  push:
    branches: [ main, feat/v6-3d-character-story-engine ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx playwright
          playwright install --with-deps chromium

      - name: Install Remotion dependencies
        run: |
          cd remotion
          npm ci
          npx remotion browser ensure

      - name: Run Remotion unit tests
        run: |
          cd remotion
          npm test

      - name: Run Test Suite
        env:
          FRAMEFORGE_HOSTED: '0'
          SKIP_HYPERFRAMES: '1'
        run: |
          pytest -v

      - name: Run CI Smoke Render (Remotion + ffprobe validation)
        run: |
          python scripts/ci_smoke_render.py

      - name: Run Mobile 390px Viewport Check
        run: |
          python scripts/check_mobile_390.py

      - name: Check Fixtures are Unmodified
        run: |
          git diff --exit-code tests/fixtures

